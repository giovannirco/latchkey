# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PLATFORMIO_VERSION: "6.2.0"
  PLATFORMIO_SETTING_ENABLE_TELEMETRY: "No"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and package
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tagged commit is on main
        run: |
          if ! git rev-parse --verify --quiet refs/remotes/origin/main > /dev/null; then
            echo "::error::origin/main was not fetched"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::the tagged commit $(git rev-parse --short HEAD) is not on main; release only commits that CI passed on main"
            exit 1
          fi
      - name: Version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          if ! printf '%s\n' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 tools/release/release_notes.py "$VERSION" > "$RUNNER_TEMP/release-notes.md"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.13"
          enable-cache: false
      - name: Unity tests on the host
        run: uvx "platformio==${PLATFORMIO_VERSION}" test -e native
      - name: Build esp32 and esp32s3
        run: uvx "platformio==${PLATFORMIO_VERSION}" run -e esp32 -e esp32s3
      - name: App image sizes and the 1.8 MB gate
        run: python3 tools/ci/firmware_size.py --summary "$GITHUB_STEP_SUMMARY"
      - name: Factory images, OTA images, manifests and SHA256SUMS
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 tools/release/merge_images.py --version "$VERSION" --out dist esp32 esp32s3
          cp "$RUNNER_TEMP/release-notes.md" dist/release-notes.md
          {
            echo "### SHA256SUMS"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Pages site with the flasher and this release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 tools/release/build_site.py --version "$VERSION" --dist dist --out site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
          retention-days: 7

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Create the release with the images and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Latchkey $VERSION" --notes-file dist/release-notes.md \
            dist/*.bin dist/SHA256SUMS

  pages:
    name: GitHub Pages
    needs: [build, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
