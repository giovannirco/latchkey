# SPDX-License-Identifier: GPL-3.0-or-later
name: Refresh Pages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Latest stable firmware version (MAJOR.MINOR.PATCH)
        required: true
        type: string

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Verify release and assemble site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require main and a release version
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Pages refreshes must run from main"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the latest stable release on this main history
        run: |
          tag=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease \
            --jq 'select(.isDraft == false and .isPrerelease == false) | .tagName')
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [ "$tag" != "v$VERSION" ] || [ "$tag" != "$latest" ]; then
            echo "::error::choose the latest published stable release"
            exit 1
          fi
          if ! git merge-base --is-ancestor "refs/tags/$tag" HEAD; then
            echo "::error::the release tag is not on this main history"
            exit 1
          fi
      - name: Test release tooling
        run: python3 -m unittest discover -s tools/release -p 'test_*.py'
      - name: Download published firmware without rebuilding
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "latchkey-$VERSION-esp32-factory.bin" \
            --pattern "latchkey-$VERSION-esp32-ota.bin" \
            --pattern "latchkey-$VERSION-esp32s3-factory.bin" \
            --pattern "latchkey-$VERSION-esp32s3-ota.bin" \
            --pattern SHA256SUMS
          python3 tools/release/prepare_site_release.py --version "$VERSION" --dist dist
          python3 tools/release/build_site.py --version "$VERSION" --dist dist --out site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site/
          retention-days: 7

  deploy:
    name: GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
