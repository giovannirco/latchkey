[platformio]
default_envs = esp32, esp32s3

[esp_common]
platform = espressif32@8.0.0
platform_packages =
    platformio/framework-espidf@4.60100.0
    platformio/toolchain-xtensa-esp-elf@15.2.0+20251204
    platformio/tool-esptool@2.50400.0
    platformio/tool-cmake@3.30.2
    platformio/tool-ninja@1.13.2
framework = espidf
extra_scripts = pre:tools/pio_build_web.py
upload_speed = 460800
monitor_speed = 115200
test_ignore = *

[env:esp32]
extends = esp_common
board_build.embed_files = ${platformio.build_dir}/${this.__env__}/web/index.html.gz
board_build.embed_txtfiles = ${platformio.build_dir}/${this.__env__}/web/index.html.gz.csp.txt
board = esp32dev
board_build.partitions = partitions/4mb.csv
board_upload.flash_size = 4MB
build_flags =
    -DLATCHKEY_BOARD=\"esp32-devkit\"
    -DLATCHKEY_BUTTON_GPIO=0

[env:esp32s3]
extends = esp_common
board_build.embed_files = ${platformio.build_dir}/${this.__env__}/web/index.html.gz
board_build.embed_txtfiles = ${platformio.build_dir}/${this.__env__}/web/index.html.gz.csp.txt
board = esp32-s3-devkitc-1
board_build.partitions = partitions/8mb.csv
board_upload.flash_size = 8MB
build_flags =
    -DLATCHKEY_BOARD=\"esp32s3-atom\"
    -DLATCHKEY_BUTTON_GPIO=0

[env:esp32-rollback-test]
extends = env:esp32
build_flags =
    -DLATCHKEY_BOARD=\"esp32-devkit\"
    -DLATCHKEY_BUTTON_GPIO=40

[env:native]
platform = native@1.2.1
test_framework = unity
lib_deps = throwtheswitch/Unity@2.6.1
lib_extra_dirs = components
test_build_src = no
build_flags = -std=gnu++20 -fno-exceptions -fno-rtti
